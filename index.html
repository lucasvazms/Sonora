<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c47ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sonora</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f2f2f5;--acc:#6c47ff;--mut:#777;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#f1f1f1;--card:#1e1e24;--mut:#999}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;max-width:560px;margin:auto;padding:16px 16px 40px}
h1{font-size:20px;margin:0 0 12px}
button{font-family:inherit;color:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-size:16px}
.btn.sec{background:var(--card);color:var(--fg)}
.now{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
.card{background:var(--card);border-radius:16px;padding:14px}
#title{font-weight:600;min-height:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
audio{width:100%;margin-top:10px}
.ctrl{display:flex;gap:8px;margin-top:8px}
.ctrl .btn{flex:1;padding:10px}
.on{outline:2px solid var(--acc)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:0;background:var(--card);border-radius:20px;padding:8px 14px;font-size:15px;white-space:nowrap}
.chip.sel{background:var(--acc);color:#fff}
.plbar{display:flex;gap:8px;margin:8px 0}
.plbar .btn{padding:8px 12px;font-size:14px}
input[type=search]{width:100%;padding:11px;border-radius:12px;border:1px solid var(--card);background:var(--card);color:var(--fg);font-size:16px;margin:8px 0 4px}
ul{list-style:none;padding:0;margin:8px 0 0}
li{display:flex;align-items:center;gap:6px;border-radius:10px}
li.cur{background:var(--card);color:var(--acc);font-weight:600}
li .n{flex:1;padding:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
li .x{background:none;border:0;font-size:22px;padding:8px 12px;color:var(--mut)}
.hint{color:var(--mut);font-size:13px;margin:6px 0}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:10}
#sheet .box{background:var(--bg);width:100%;max-width:560px;margin:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:80%;overflow:auto}
#sheet h2{font-size:16px;margin:0 0 10px}
#sheet .opt{display:block;width:100%;text-align:left;background:var(--card);border:0;border-radius:12px;padding:13px;margin:6px 0;font-size:16px}
#sheet .red{color:#e5484d}
</style>
</head>
<body>
<h1>🎵 Sonora</h1>
<input id="files" type="file" accept="audio/*,video/*,.mp3,.m4a,.mp4,.webm,.opus,.flac,.ogg,.wav" multiple hidden>
<button class="btn" id="add">+ Adicionar músicas</button>
<p class="hint" id="info"></p>

<div class="now">
  <div class="card">
    <div id="title">Nenhuma música tocando</div>
    <audio id="player" controls></audio>
    <div class="ctrl">
      <button class="btn sec" id="prev">⏮</button>
      <button class="btn sec" id="next">⏭</button>
      <button class="btn sec" id="shuf">🔀</button>
      <button class="btn sec" id="rep">🔁</button>
    </div>
  </div>
</div>

<div class="chips" id="chips"></div>
<div class="plbar" id="plbar" style="display:none">
  <button class="btn sec" id="renpl">✏️ Renomear</button>
  <button class="btn sec" id="delpl">🗑 Apagar playlist</button>
</div>
<input id="q" type="search" placeholder="Buscar música">
<ul id="list"></ul>

<div id="sheet"><div class="box" id="box"></div></div>

<script>
const $=id=>document.getElementById(id);
const player=$('player');
let songs=[],pls=[],curPl='all',curId=null,view=[],shuffle=false,repeat=false,curUrl=null;

/* ---------- banco de dados ---------- */
function db(){
  if(!db.p)db.p=new Promise((res,rej)=>{
    const r=indexedDB.open('musicapp',2);
    r.onupgradeneeded=()=>{
      const d=r.result;
      if(!d.objectStoreNames.contains('songs'))d.createObjectStore('songs',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('playlists'))d.createObjectStore('playlists',{keyPath:'id',autoIncrement:true});
    };
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
  return db.p;
}
function run(store,mode,fn){
  return db().then(d=>new Promise((res,rej)=>{
    const t=d.transaction(store,mode);
    const r=fn(t.objectStore(store));
    t.oncomplete=()=>res(r&&r.result);
    t.onerror=t.onabort=()=>rej(t.error);
  }));
}

/* ---------- dados ---------- */
async function refresh(){
  try{
    songs=await run('songs','readonly',s=>s.getAll());
    pls=await run('playlists','readonly',s=>s.getAll());
  }catch(e){songs=[];pls=[];$('info').textContent='Não consegui abrir o armazenamento do navegador.'}
  songs.sort((a,b)=>a.name.localeCompare(b.name,'pt',{numeric:true}));
  if(curPl!=='all'&&!pls.find(p=>p.id===curPl))curPl='all';
  render();usage();
}
async function usage(){
  let t=songs.length+' músicas salvas';
  try{const e=await navigator.storage.estimate();t+=' · '+(e.usage/1048576).toFixed(0)+' MB usados'}catch(e){}
  $('info').textContent=t;
}
const plById=id=>pls.find(p=>p.id===id);
async function newPlaylist(){
  const n=(prompt('Nome da playlist:')||'').trim();
  if(!n)return null;
  const id=await run('playlists','readwrite',s=>s.add({name:n,songIds:[]}));
  await refresh();
  return id;
}

/* ---------- interface ---------- */
function render(){
  const ch=$('chips');ch.innerHTML='';
  const mk=(label,id,sel)=>{
    const b=document.createElement('button');
    b.className='chip'+(sel?' sel':'');b.textContent=label;
    b.onclick=()=>{curPl=id;render()};
    ch.appendChild(b);
  };
  mk('Todas','all',curPl==='all');
  pls.forEach(p=>mk(p.name+' ('+p.songIds.length+')',p.id,curPl===p.id));
  const nb=document.createElement('button');
  nb.className='chip';nb.textContent='+ Nova playlist';
  nb.onclick=async()=>{const id=await newPlaylist();if(id){curPl=id;render()}};
  ch.appendChild(nb);
  $('plbar').style.display=curPl==='all'?'none':'flex';

  const q=$('q').value.toLowerCase();
  let base=songs;
  if(curPl!=='all'){const p=plById(curPl);base=songs.filter(s=>p.songIds.includes(s.id))}
  view=base.filter(s=>s.name.toLowerCase().includes(q));
  const ul=$('list');ul.innerHTML='';
  if(!view.length){
    const li=document.createElement('li');
    li.innerHTML='<div class="n hint"></div>';
    li.firstChild.textContent=curPl==='all'?'Nenhuma música ainda. Toque em + Adicionar músicas.':'Playlist vazia. Toque nos três pontinhos de uma música (em Todas) pra adicionar aqui.';
    ul.appendChild(li);
  }
  view.forEach(s=>{
    const li=document.createElement('li');
    if(s.id===curId)li.className='cur';
    const n=document.createElement('div');n.className='n';n.textContent=s.name;
    n.onclick=()=>play(s.id);
    const x=document.createElement('button');x.className='x';x.textContent='⋯';
    x.onclick=()=>openSheet(s);
    li.append(n,x);ul.appendChild(li);
  });
}

/* ---------- menu da música ---------- */
function openSheet(s){
  const box=$('box');box.innerHTML='';
  const h=document.createElement('h2');h.textContent=s.name;box.appendChild(h);
  pls.forEach(p=>{
    const b=document.createElement('button');b.className='opt';
    b.textContent=(p.songIds.includes(s.id)?'✅ ':'⬜ ')+p.name;
    b.onclick=async()=>{
      const i=p.songIds.indexOf(s.id);
      if(i>=0)p.songIds.splice(i,1);else p.songIds.push(s.id);
      await run('playlists','readwrite',st=>st.put(p));
      render();openSheet(s);
    };
    box.appendChild(b);
  });
  const np=document.createElement('button');np.className='opt';np.textContent='➕ Nova playlist com esta música';
  np.onclick=async()=>{
    const id=await newPlaylist();
    if(id){const p=plById(id);p.songIds.push(s.id);await run('playlists','readwrite',st=>st.put(p));render();openSheet(s)}
  };
  box.appendChild(np);
  const del=document.createElement('button');del.className='opt red';del.textContent='🗑 Apagar música do app';
  del.onclick=()=>removeSong(s);
  box.appendChild(del);
  const c=document.createElement('button');c.className='opt';c.textContent='Fechar';
  c.onclick=closeSheet;box.appendChild(c);
  $('sheet').style.display='flex';
}
function closeSheet(){$('sheet').style.display='none'}
$('sheet').onclick=e=>{if(e.target.id==='sheet')closeSheet()};

async function removeSong(s){
  if(!confirm('Apagar "'+s.name+'" do app?'))return;
  closeSheet();
  if(s.id===curId){player.pause();player.removeAttribute('src');curId=null;$('title').textContent='Nenhuma música tocando'}
  for(const p of pls){
    const i=p.songIds.indexOf(s.id);
    if(i>=0){p.songIds.splice(i,1);await run('playlists','readwrite',st=>st.put(p))}
  }
  await run('songs','readwrite',st=>st.delete(s.id));
  await refresh();
}

/* ---------- playlists: renomear / apagar ---------- */
$('renpl').onclick=async()=>{
  const p=plById(curPl);if(!p)return;
  const n=(prompt('Novo nome:',p.name)||'').trim();
  if(!n)return;
  p.name=n;await run('playlists','readwrite',st=>st.put(p));render();
};
$('delpl').onclick=async()=>{
  const p=plById(curPl);if(!p)return;
  if(!confirm('Apagar a playlist "'+p.name+'"? As músicas continuam no app.'))return;
  await run('playlists','readwrite',st=>st.delete(p.id));
  curPl='all';await refresh();
};

/* ---------- reprodução ---------- */
function play(id){
  const s=songs.find(x=>x.id===id);if(!s)return;
  curId=id;
  if(curUrl)URL.revokeObjectURL(curUrl);
  curUrl=URL.createObjectURL(s.blob);
  player.src=curUrl;player.play().catch(()=>{});
  $('title').textContent=s.name;
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title:s.name,artist:'Sonora'});
    navigator.mediaSession.setActionHandler('nexttrack',next);
    navigator.mediaSession.setActionHandler('previoustrack',prev);
  }
  render();
}
function step(d){
  if(!view.length)return;
  const i=view.findIndex(s=>s.id===curId);
  play(view[(i+d+view.length)%view.length].id);
}
function next(){
  if(shuffle&&view.length>1){
    let s;do{s=view[Math.floor(Math.random()*view.length)]}while(s.id===curId);
    play(s.id);
  }else step(1);
}
const prev=()=>step(-1);
player.onended=()=>{if(repeat){player.currentTime=0;player.play()}else next()};
$('next').onclick=next;$('prev').onclick=prev;
$('shuf').onclick=e=>{shuffle=!shuffle;e.currentTarget.classList.toggle('on',shuffle)};
$('rep').onclick=e=>{repeat=!repeat;e.currentTarget.classList.toggle('on',repeat)};
$('q').oninput=render;

/* ---------- adicionar músicas ---------- */
$('add').onclick=()=>$('files').click();
$('files').onchange=async e=>{
  const fs=[...e.target.files];let n=0;const ids=[];
  for(const f of fs){
    $('info').textContent='Salvando '+(++n)+' de '+fs.length+'…';
    try{ids.push(await run('songs','readwrite',s=>s.add({name:f.name.replace(/\.[^.]+$/,''),type:f.type,blob:f,added:Date.now()})))}
    catch(err){$('info').textContent='Sem espaço ou erro ao salvar: '+f.name;break}
  }
  e.target.value='';
  if(curPl!=='all'&&ids.length){
    const p=plById(curPl);
    if(p){p.songIds.push(...ids);await run('playlists','readwrite',st=>st.put(p))}
  }
  await refresh();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
};

/* ---------- PWA ---------- */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
refresh();
</script>
</body>
</html>
